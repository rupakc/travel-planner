<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Apply the saved/system theme before any CSS loads (no light flash in dark mode).
         Mirrors src/theme/ThemeContext.jsx; #121a2b is tokens.json dark.white. -->
    <script>
      (function () {
        var t = null, dark = false, root = document.documentElement;
        try { t = localStorage.getItem('tp_theme'); } catch (e) {}
        try {
          dark = t === 'dark' || (t !== 'light' && !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && dark) m.setAttribute('content', '#121a2b');
      })();
    </script>
    <meta name="description" content="Plan a whole trip in one search: flights, weather, hotels, activities, visa, local tips and a day-by-day itinerary." />
    <title>Travel Planner — AI-Powered Trip Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
