site_name: Travel Planner — Developer Docs
site_description: AI-powered travel planning with multi-agent orchestration — flights, hotels, activities, visa, SIM, itineraries, destination discovery, and more
repo_url: https://github.com/rupakc/travel-planner

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: default
      primary: teal
      accent: teal

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: Home.md
  - Getting started:
      - Setup and Installation: Setup-and-Installation.md
      - Configuration: Configuration.md
  - Using the app:
      - Trip Planning Features: Trip-Planning-Features.md
      - Multi-City Trips: Multi-City-Trips.md
      - Chat Assistant: Chat-Assistant.md
      - Personalization: Personalization.md
      - Sharing and Plans: Sharing-and-Plans.md
  - Internals:
      - Architecture: Architecture.md
      - Agent System: Agent-System.md
      - Place and Airport Data: Place-and-Airport-Data.md
      - Frontend: Frontend.md
      - API Reference: API-Reference.md
  - Operations:
      - Testing and CI: Testing-and-CI.md
      - Deployment: Deployment.md
      - Contributing: Contributing.md
      - Changelog: Changelog.md
