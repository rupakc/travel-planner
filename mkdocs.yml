site_name: Travel Planner — Developer Docs
site_description: AI-powered travel planning with multi-agent orchestration — flights, hotels, activities, visa, SIM, itineraries, destination discovery, and more
repo_url: https://github.com/rupakc/travel-planner

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: default
      primary: teal
      accent: teal

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Setup and Installation: Setup-and-Installation.md
  - Configuration: Configuration.md
  - Architecture: architecture.md
  - Agent System: agents.md
  - Frontend: Frontend.md
  - API Reference: api.md
  - Deployment: deployment.md
  - Contributing: contributing.md
