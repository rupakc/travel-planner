services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-compose}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin-dev-password}
      - DATA_DIR=/data
      - BACKUP_BUCKET=
      - CORS_ORIGINS=http://localhost:8080
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
