# Drop-in for apt-daily-upgrade.timer: unattended-upgrades (security + Docker)
# install nightly at 03:30 Berlin time, when a Docker restart hurts least.
# Reboots happen only in the weekly window (voyager-window.timer).
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:30:00 Europe/Berlin
RandomizedDelaySec=10min
