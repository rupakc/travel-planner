name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install mkdocs mkdocstrings[python] mkdocs-material ghp-import
      - name: Build docs
        run: mkdocs build
      - name: Inject custom home page
        run: cp docs_homepage/index.html site/index.html
      - name: Redirect renamed pages
        run: |
          for pair in architecture:Architecture deployment:Deployment contributing:Contributing; do
            old=${pair%%:*}; new=${pair##*:}
            mkdir -p "site/$old"
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../%s/"><link rel="canonical" href="../%s/"><a href="../%s/">Moved to %s</a>\n' "$new" "$new" "$new" "$new" > "site/$old/index.html"
          done
      - name: Deploy to GitHub Pages
        run: ghp-import -n -p -f site
