name: CI

on:
  push:
    # main runs CI through deploy.yml (workflow_call), which publishes only
    # after every job here passes
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip-image-builds:
        # deploy.yml: its `build` job builds and Trivy-scans the images that ship
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.12-
      # Install the pinned ruff from requirements-dev.txt — same version used
      # locally and in pre-commit, so formatting never diverges between
      # developer machines and CI.
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/ deploy/ infrastructure/gcp/
      - run: ruff format --check backend/ deploy/ infrastructure/gcp/
      # VM host scripts (deploy/gcp, infrastructure/gcp); shellcheck ships on ubuntu-latest
      - run: shellcheck -x deploy/gcp/*.sh deploy/gcp/host/*.sh deploy/gcp/tests/*.sh infrastructure/gcp/*.sh

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx eslint src/ --max-warnings 0
        working-directory: frontend

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.12-
      - run: pip install -r backend/requirements-dev.txt
      # B105/B106: test passwords. B608: SQL with sqlite_master table names (not user input).
      - run: bandit -r backend/app/ -ll --skip B105,B106,B608
      - name: Python vulnerability audit
        run: |
          # Ignored CVEs — revisit on each release:
          # PYSEC-2023-62:  starlette — fixed in later starlette, not relevant to us (no ReDoS path)
          # (2026-10: python-jose replaced by PyJWT>=2.15.1, so the python-jose/ecdsa and
          #  pyjwt<=2.10.1 ignores PYSEC-2025-185 / PYSEC-2025-183 were dropped.)
          pip-audit -r backend/requirements.txt \
            --timeout 60 \
            --ignore-vuln PYSEC-2023-62
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      # Only HIGH/CRITICAL fails CI. Moderate vulns in dev-only chains (esbuild/vitest)
      # are accepted — they are never present in the production Caddy image (static SPA).
      - run: npm audit --audit-level=high
        working-directory: frontend

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.12-
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: pytest --cov=app --cov-report=xml --cov-fail-under=70 -q
        working-directory: backend
        env:
          DATA_DIR: /tmp/test-data
          ADMIN_PASSWORD: test-admin-pw

  # The VM kit's Python tests, in their own job so they run in parallel with
  # the backend suite (together they were the slowest job, ~2 min each):
  # egress governor, deploy.sh with fakes, image-inputs-id.sh, old-prod
  # migration, bootstrap.sh with stub gcloud (no root/network)
  test-deploy-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.12-
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider deploy/gcp/tests infrastructure/gcp/tests

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend

  # The VM kit's host layer for real: the governor's rules on iptables-nft
  # (Debian 13, like the VM) for every tier, a rejected ruleset leaving the
  # old one in force, the deployer and first boot with fake docker/curl/
  # systemctl, and systemd-analyze verify of the units
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Kernel modules for the governor's matches
        run: sudo modprobe -a ip_set ip_set_hash_ip xt_set xt_hashlimit xt_multiport nft_compat
      - name: Governor on real iptables + systemd units (debian:trixie)
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" \
            debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6 \
            bash /src/deploy/gcp/tests/host_checks.sh

  # PRs and branch pushes: do the images still build? Build-only (nothing
  # pushed), in parallel with the tests, and only the images whose inputs the
  # change touches; no usable base to diff against, or a change to this file,
  # builds all. Reads the deploy workflow's BuildKit cache, writes none.
  # Skipped when deploy.yml calls CI: its `build` job builds the images that
  # ship and Trivy-scans them before they are signed.
  #   app    backend/Dockerfile: backend/, .agents/ (+ .dockerignore)
  #   caddy  deploy/gcp/caddy.Dockerfile: frontend/, deploy/gcp/Caddyfile
  #   nginx  frontend/Dockerfile, used only by local `docker compose up`: its
  #          own files and frontend/package*.json (the SPA build itself is
  #          covered by caddy)
  image-builds:
    if: ${{ !inputs.skip-image-builds }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Which images does this change touch?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          files=""
          if [ "$EVENT" = pull_request ]; then
            # The merge commit's first parent is the base branch
            files="$(git diff --name-only HEAD^1 HEAD)" || files=""
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] &&
            git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD)" || files=""
          fi
          printf '%s\n' "${files:-(unknown: building all)}"
          if [ -z "$files" ] || grep -qx '.github/workflows/ci.yml' <<<"$files"; then
            printf 'app=true\ncaddy=true\nnginx=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          has() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          {
            echo "app=$(has '^(backend/|\.agents/|\.dockerignore$)')"
            echo "caddy=$(has '^(frontend/|deploy/gcp/(Caddyfile|caddy\.Dockerfile)$|\.dockerignore$)')"
            echo "nginx=$(has '^frontend/(Dockerfile|nginx\.conf\.template|package(-lock)?\.json|\.dockerignore)$')"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.changed.outputs.app == 'true' || steps.changed.outputs.caddy == 'true'
      - name: Build app image (no push)
        if: steps.changed.outputs.app == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=app
      - name: Build caddy + SPA image (no push)
        if: steps.changed.outputs.caddy == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/gcp/caddy.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=caddy
      - name: Build the local nginx frontend image
        if: steps.changed.outputs.nginx == 'true'
        run: docker build frontend/ -t frontend:ci
