name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.12-
      # Install the pinned ruff from requirements-dev.txt — same version used
      # locally and in pre-commit, so formatting never diverges between
      # developer machines and CI.
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/
      - run: ruff format --check backend/

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx eslint src/ --max-warnings 0
        working-directory: frontend

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.12-
      - run: pip install -r backend/requirements-dev.txt
      # B105/B106: test passwords. B608: SQL with sqlite_master table names (not user input).
      - run: bandit -r backend/app/ -ll --skip B105,B106,B608
      - name: Python vulnerability audit
        run: |
          # --timeout: per-package metadata fetch timeout (prevents indefinite hangs).
          # Add --ignore-vuln VULN_ID only when: (a) no fix is available AND
          # (b) the CVE is not exploitable in our Cloud Run context.
          pip-audit -r backend/requirements.txt \
            --timeout 60 \
            --ignore-vuln PYSEC-2023-62
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      # Only HIGH/CRITICAL fails CI. Moderate vulns in dev-only chains (esbuild/vitest)
      # are accepted — they are never present in the production nginx image.
      - run: npm audit --audit-level=high
        working-directory: frontend

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.12-
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: pytest --cov=app --cov-report=xml --cov-fail-under=70 -q
        working-directory: backend
        env:
          DATA_DIR: /tmp/test-data
          ADMIN_PASSWORD: test-admin-pw

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend

  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-backend, lint-frontend, security, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile . -t backend:${{ github.sha }}
      - name: Build frontend image
        run: docker build frontend/ -t frontend:${{ github.sha }}
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.70.0
          wget -qO trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
          rm trivy.tar.gz
          trivy --version
      - name: Scan backend image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --no-progress \
            backend:${{ github.sha }}
      - name: Scan frontend image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --no-progress \
            frontend:${{ github.sha }}
