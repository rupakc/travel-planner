name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs
        run: |
          gcloud services enable \
            serviceusage.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            storage.googleapis.com \
            iam.googleapis.com \
            cloudresourcemanager.googleapis.com \
            compute.googleapis.com \
            monitoring.googleapis.com \
            logging.googleapis.com \
            --project=${{ secrets.GCP_PROJECT_ID }} --quiet

      - name: Create Terraform state bucket
        run: |
          BUCKET="${{ secrets.GCP_PROJECT_ID }}-tf-state"
          if ! gcloud storage buckets describe "gs://$BUCKET" \
               --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            gcloud storage buckets create "gs://$BUCKET" \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --location=europe-west1 \
              --uniform-bucket-level-access
            gcloud storage buckets update "gs://$BUCKET" --versioning
          fi

      - name: Create Artifact Registry repo
        run: |
          if ! gcloud artifacts repositories describe travel-planner \
               --location=europe-west1 \
               --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            gcloud artifacts repositories create travel-planner \
              --repository-format=docker \
              --location=europe-west1 \
              --project=${{ secrets.GCP_PROJECT_ID }}
          fi

      - name: Populate Secret Manager secrets
        run: |
          PROJECT=${{ secrets.GCP_PROJECT_ID }}
          upsert_secret() {
            local name="$1"
            local value="$2"
            if ! gcloud secrets describe "$name" --project="$PROJECT" &>/dev/null; then
              gcloud secrets create "$name" \
                --project="$PROJECT" \
                --replication-policy=automatic
            fi
            echo -n "$value" | gcloud secrets versions add "$name" \
              --data-file=- --project="$PROJECT"
          }
          upsert_secret "anthropic-api-key" "${{ secrets.ANTHROPIC_API_KEY }}"
          upsert_secret "jwt-secret-key"    "${{ secrets.JWT_SECRET_KEY }}"
          upsert_secret "admin-password"    "${{ secrets.ADMIN_PASSWORD }}"
          upsert_secret "serpapi-key"       "${{ secrets.SERPAPI_KEY }}"
          upsert_secret "serper-key"        "${{ secrets.SERPER_KEY }}"

  push-images:
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push backend
        run: |
          REGISTRY="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner"
          docker build -f backend/Dockerfile . -t "$REGISTRY/backend:${{ github.sha }}"
          docker push "$REGISTRY/backend:${{ github.sha }}"

      - name: Build and push frontend
        run: |
          REGISTRY="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner"
          docker build frontend/ -t "$REGISTRY/frontend:${{ github.sha }}"
          docker push "$REGISTRY/frontend:${{ github.sha }}"

  terraform:
    runs-on: ubuntu-latest
    needs: [bootstrap, push-images]
    env:
      TF_VAR_project_id:     ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_admin_email:    rchakraborty@dataguard.com
      TF_VAR_backend_image:  europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner/backend:${{ github.sha }}
      TF_VAR_frontend_image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner/frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_PROJECT_ID }}-tf-state" \
            -backend-config="prefix=terraform/state"
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Import pre-existing GCS buckets into state
        run: |
          # The sqlite-backup bucket may already exist in GCP from a prior run
          # but not be in Terraform state (e.g. after a state reset or rename).
          # Import it so Terraform doesn't try to re-create it and get a 409.
          BACKUP_BUCKET="${TF_VAR_project_id}-sqlite-backup"
          if gcloud storage buckets describe "gs://${BACKUP_BUCKET}" --quiet 2>/dev/null; then
            if ! terraform state show module.storage.google_storage_bucket.sqlite_backup 2>/dev/null; then
              echo "Importing ${BACKUP_BUCKET} into Terraform state..."
              terraform import module.storage.google_storage_bucket.sqlite_backup "${BACKUP_BUCKET}"
            else
              echo "Bucket already in state, skipping import."
            fi
          else
            echo "Bucket does not exist yet, Terraform will create it."
          fi
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: infrastructure/terraform

      - name: Show URLs
        run: |
          echo "Frontend: $(terraform output -raw frontend_url)"
          echo "Backend:  $(terraform output -raw backend_url)"
        working-directory: infrastructure/terraform
