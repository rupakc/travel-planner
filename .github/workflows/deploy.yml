# Deploy: every merge to main that passes all of CI publishes signed images
# and moves their `prod` tag. The VM pulls them itself (deploy/gcp/host/
# deploy.sh, every 5 min): it resolves `prod` to a digest, verifies the cosign
# signature against THIS workflow on refs/heads/main, pulls, health-checks and
# rolls back on failure. This workflow has no access to the VM or GCP.
name: Deploy

on:
  push:
    branches: [main]

# One publish at a time; never cancel a half-moved tag
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push to ghcr.io/rupakc/travel-planner-*
      id-token: write # cosign keyless: GitHub OIDC → Sigstore certificate
    env:
      APP_IMAGE: ghcr.io/rupakc/travel-planner-app
      CADDY_IMAGE: ghcr.io/rupakc/travel-planner-caddy
      # The identity the VM's deployer requires (deploy.sh CERT_IDENTITY)
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - uses: imjasonh/setup-crane@v0.4

      - name: Build and push app (sha tag only)
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push caddy + SPA (sha tag only)
        id: caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gcp/caddy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.CADDY_IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Sign by digest (keyless)
        env:
          APP_REF: ${{ env.APP_IMAGE }}@${{ steps.app.outputs.digest }}
          CADDY_REF: ${{ env.CADDY_IMAGE }}@${{ steps.caddy.outputs.digest }}
        run: |
          cosign sign --yes "$APP_REF"
          cosign sign --yes "$CADDY_REF"

      - name: Verify exactly as the VM will
        env:
          APP_REF: ${{ env.APP_IMAGE }}@${{ steps.app.outputs.digest }}
          CADDY_REF: ${{ env.CADDY_IMAGE }}@${{ steps.caddy.outputs.digest }}
        run: |
          for ref in "$APP_REF" "$CADDY_REF"; do
            cosign verify --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$CERT_ISSUER" "$ref" >/dev/null
          done

      - name: Move the prod tags (same digests, nothing rebuilt)
        env:
          APP_REF: ${{ env.APP_IMAGE }}@${{ steps.app.outputs.digest }}
          CADDY_REF: ${{ env.CADDY_IMAGE }}@${{ steps.caddy.outputs.digest }}
        run: |
          crane tag "$APP_REF" prod
          crane tag "$CADDY_REF" prod
          {
            echo "### Published"
            echo "- app: \`$APP_REF\`"
            echo "- caddy: \`$CADDY_REF\`"
            echo "The VM picks these up within ~5 min (app at once; Caddy in the Sunday window)."
          } >>"$GITHUB_STEP_SUMMARY"
