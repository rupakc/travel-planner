name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs
        run: |
          for attempt in 1 2 3; do
            gcloud services enable \
              serviceusage.googleapis.com \
              run.googleapis.com \
              artifactregistry.googleapis.com \
              secretmanager.googleapis.com \
              storage.googleapis.com \
              iam.googleapis.com \
              cloudresourcemanager.googleapis.com \
              compute.googleapis.com \
              monitoring.googleapis.com \
              logging.googleapis.com \
              --project=${{ secrets.GCP_PROJECT_ID }} --quiet && break
            [ "$attempt" -lt 3 ] && { echo "Attempt $attempt failed — retrying in 15s..."; sleep 15; } || exit 1
          done

      - name: Create Terraform state bucket
        run: |
          BUCKET="${{ secrets.GCP_PROJECT_ID }}-tf-state"
          if ! gcloud storage buckets describe "gs://$BUCKET" \
               --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            gcloud storage buckets create "gs://$BUCKET" \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --location=europe-west1 \
              --uniform-bucket-level-access
            gcloud storage buckets update "gs://$BUCKET" --versioning
          fi

      - name: Create Artifact Registry repo
        run: |
          if ! gcloud artifacts repositories describe travel-planner \
               --location=europe-west1 \
               --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            gcloud artifacts repositories create travel-planner \
              --repository-format=docker \
              --location=europe-west1 \
              --project=${{ secrets.GCP_PROJECT_ID }}
          fi

      - name: Populate Secret Manager secrets
        run: |
          PROJECT=${{ secrets.GCP_PROJECT_ID }}
          upsert_secret() {
            local name="$1" value="$2"
            if ! gcloud secrets describe "$name" --project="$PROJECT" &>/dev/null; then
              gcloud secrets create "$name" --project="$PROJECT" --replication-policy=automatic
              echo -n "$value" | gcloud secrets versions add "$name" --data-file=- --project="$PROJECT"
            else
              existing=$(gcloud secrets versions access latest --secret="$name" --project="$PROJECT" 2>/dev/null || echo "__missing__")
              if [ "$existing" != "$value" ]; then
                echo -n "$value" | gcloud secrets versions add "$name" --data-file=- --project="$PROJECT"
              fi
            fi
          }
          upsert_secret "anthropic-api-key" "${{ secrets.ANTHROPIC_API_KEY }}"
          upsert_secret "jwt-secret-key"    "${{ secrets.JWT_SECRET_KEY }}"
          upsert_secret "admin-password"    "${{ secrets.ADMIN_PASSWORD }}"
          upsert_secret "serpapi-key"       "${{ secrets.SERPAPI_KEY }}"
          upsert_secret "serper-key"        "${{ secrets.SERPER_KEY }}"

  push-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        run: |
          REGISTRY="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner"
          docker buildx build \
            --cache-from "type=registry,ref=$REGISTRY/backend:cache" \
            --cache-to   "type=registry,ref=$REGISTRY/backend:cache,mode=max" \
            --tag "$REGISTRY/backend:${{ github.sha }}" \
            --tag "$REGISTRY/backend:latest" \
            --push \
            -f backend/Dockerfile .

      - name: Build and push frontend
        run: |
          REGISTRY="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner"
          docker buildx build \
            --cache-from "type=registry,ref=$REGISTRY/frontend:cache" \
            --cache-to   "type=registry,ref=$REGISTRY/frontend:cache,mode=max" \
            --tag "$REGISTRY/frontend:${{ github.sha }}" \
            --tag "$REGISTRY/frontend:latest" \
            --push \
            frontend/

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [bootstrap, push-images]
    env:
      TF_VAR_project_id:     ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_admin_email:    rchakraborty@dataguard.com
      TF_VAR_backend_image:  europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner/backend:${{ github.sha }}
      TF_VAR_frontend_image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner/frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_PROJECT_ID }}-tf-state" \
            -backend-config="prefix=terraform/state"
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Reconcile Terraform state with existing GCP resources
        run: |
          PROJECT="${TF_VAR_project_id}"
          REGION="${TF_VAR_region:-europe-west1}"

          # Import a resource only if it exists in GCP but is absent from TF state.
          # Non-fatal: if import fails after 3 attempts, plan will show it as to-create
          # and terraform apply will surface the real error at the right layer rather
          # than stopping the whole reconcile on a transient API glitch.
          tf_import_if_missing() {
            local tf_addr="$1" gcp_id="$2"
            [ -z "$gcp_id" ] && return 0
            if terraform state show "$tf_addr" &>/dev/null; then
              echo "  ✓ ${tf_addr} — already in state"
              return 0
            fi
            echo "  → Importing ${tf_addr} ..."
            local ok=0
            for attempt in 1 2 3; do
              terraform import "$tf_addr" "$gcp_id" && ok=1 && break
              echo "    attempt ${attempt}/3 failed — retrying in 5s..."
              sleep 5
            done
            if [ "$ok" -eq 0 ]; then
              echo "  ⚠ Import failed after 3 attempts — plan will show resource as to-create"
            fi
            return 0
          }

          echo "=== Storage ==="
          BACKUP_BUCKET="${PROJECT}-sqlite-backup"
          if gcloud storage buckets describe "gs://${BACKUP_BUCKET}" \
               --project="$PROJECT" --quiet 2>/dev/null; then
            tf_import_if_missing \
              "module.storage.google_storage_bucket.sqlite_backup" \
              "$BACKUP_BUCKET"
          fi

          echo "=== Cloud Run services ==="
          for PAIR in "backend:travel-planner-backend" "frontend:travel-planner-frontend"; do
            SHORT="${PAIR%%:*}"
            SVC_NAME="${PAIR##*:}"
            if gcloud run services describe "$SVC_NAME" \
                 --region="$REGION" --project="$PROJECT" &>/dev/null 2>&1; then
              tf_import_if_missing \
                "module.${SHORT}_service.google_cloud_run_v2_service.${SHORT}" \
                "projects/${PROJECT}/locations/${REGION}/services/${SVC_NAME}"
            fi
          done

          echo "=== Monitoring: notification channel ==="
          CHANNEL_ID=$(gcloud beta monitoring channels list \
            --project="$PROJECT" \
            --filter="displayName='Admin Email' AND type=email" \
            --format="value(name)" 2>/dev/null | head -1)
          tf_import_if_missing \
            "module.monitoring.google_monitoring_notification_channel.email" \
            "$CHANNEL_ID"

          echo "=== Monitoring: uptime check ==="
          UPTIME_ID=$(gcloud monitoring uptime list-configs \
            --project="$PROJECT" \
            --filter="displayName='Backend Health Check'" \
            --format="value(name)" 2>/dev/null | head -1)
          tf_import_if_missing \
            "module.monitoring.google_monitoring_uptime_check_config.backend_health" \
            "$UPTIME_ID"

          echo "=== Logging metrics ==="
          for METRIC in "api_request_count" "feature_usage_count"; do
            if gcloud logging metrics describe "$METRIC" \
                 --project="$PROJECT" &>/dev/null 2>&1; then
              tf_import_if_missing \
                "module.monitoring.google_logging_metric.${METRIC}" \
                "${PROJECT}/${METRIC}"
            fi
          done

          echo "=== Alert policies ==="
          TOKEN=$(gcloud auth print-access-token --quiet 2>/dev/null)
          POLICIES=$(curl -sf \
            "https://monitoring.googleapis.com/v3/projects/${PROJECT}/alertPolicies" \
            -H "Authorization: Bearer $TOKEN" 2>/dev/null || echo '{}')
          for PAIR in \
            "Backend Uptime Failure|uptime_failure" \
            "High API Error Rate|high_error_rate" \
            "High API Latency|high_latency"; do
            DISPLAY_NAME="${PAIR%%|*}"
            TF_NAME="${PAIR##*|}"
            POLICY_ID=$(echo "$POLICIES" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          target = sys.argv[1]
          for p in data.get('alertPolicies', []):
              if p.get('displayName') == target:
                  print(p['name']); break
          " "$DISPLAY_NAME" 2>/dev/null)
            tf_import_if_missing \
              "module.monitoring.google_monitoring_alert_policy.${TF_NAME}" \
              "$POLICY_ID"
          done

          echo "=== Monitoring dashboard ==="
          DASHBOARD_ID=$(gcloud monitoring dashboards list \
            --project="$PROJECT" \
            --format="value(name,displayName)" 2>/dev/null \
            | grep "Travel Planner" | awk '{print $1}' | head -1)
          tf_import_if_missing \
            "module.monitoring.google_monitoring_dashboard.main" \
            "$DASHBOARD_ID"
        working-directory: infrastructure/terraform

      - name: Capture frontend URL for CORS
        run: |
          REGION="${TF_VAR_region:-europe-west1}"
          FRONTEND_URL=$(gcloud run services describe travel-planner-frontend \
            --region="$REGION" \
            --project="${TF_VAR_project_id}" \
            --format='value(status.url)' 2>/dev/null || echo "")
          echo "TF_VAR_frontend_url=${FRONTEND_URL}" >> "$GITHUB_ENV"
          if [ -n "$FRONTEND_URL" ]; then
            echo "Frontend URL for CORS: ${FRONTEND_URL}"
          else
            echo "Frontend not yet deployed — CORS will include localhost only on this run"
          fi

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: infrastructure/terraform

      - name: Show URLs
        run: |
          echo "Frontend: $(terraform output -raw frontend_url)"
          echo "Backend:  $(terraform output -raw backend_url)"
        working-directory: infrastructure/terraform
