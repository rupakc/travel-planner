name: Deploy

on:
  push:
    branches: [main]

jobs:
  push-images:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.registry.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: registry
        run: |
          echo "url=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-planner" >> "$GITHUB_OUTPUT"
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push backend
        run: |
          docker build backend/ -t ${{ steps.registry.outputs.url }}/backend:${{ github.sha }}
          docker push ${{ steps.registry.outputs.url }}/backend:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build frontend/ -t ${{ steps.registry.outputs.url }}/frontend:${{ github.sha }}
          docker push ${{ steps.registry.outputs.url }}/frontend:${{ github.sha }}

  terraform:
    runs-on: ubuntu-latest
    needs: push-images
    env:
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_backend_image: ${{ needs.push-images.outputs.registry }}/backend:${{ github.sha }}
      TF_VAR_frontend_image: ${{ needs.push-images.outputs.registry }}/frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="prefix=terraform/state"
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: infrastructure/terraform

      - name: Show URLs
        run: |
          echo "Frontend: $(terraform output -raw frontend_url)"
          echo "Backend:  $(terraform output -raw backend_url)"
        working-directory: infrastructure/terraform
