# Deploy: every merge to main that passes all of CI moves the `prod` tags of
# the signed images. The VM pulls them itself (deploy/gcp/host/deploy.sh,
# every minute): it resolves `prod` to a digest, verifies the cosign
# signature against THIS workflow on refs/heads/main, pulls, health-checks and
# rolls back on failure. This workflow has no access to the VM or GCP.
# Every action is pinned to a full commit SHA: this workflow can sign as the
# identity the VM trusts.
#
# Jobs (the two images are independent: a Caddy scan failure never blocks an
# app fix, and vice versa):
#   ci             all of ci.yml (lint, audits, tests, host checks)
#   build-app      in parallel with ci: build the app only if its inputs
#   build-caddy    changed, push sha-<sha>, Trivy-scan (no id-token)
#   promote-app    needs [ci, build-app]   ─┐ plain needs, no always()/failure():
#   promote-caddy  needs [ci, build-caddy] ─┘ skipped unless both succeeded.
#     deploy/ci/promote-image.sh: still main's HEAD? → cosign-sign the new
#     digest → verify as the VM will → move `prod` (a skipped image: check
#     `prod` didn't move, sign nothing).
#
# Invariant: every image signed by deploy.yml@refs/heads/main passed CI and
# was main's HEAD when signed. Only the promote jobs hold id-token, and only
# for the digest they are about to move. Building before CI has passed is
# safe: an unsigned sha-* image is refused by the VM, and deploy.sh only ever
# resolves and deploys the digest of the `prod` tag (TAG=prod; resolve_digest
# → deploy_app / deploy_edge), never a sha-* tag or any other digest. Each
# image is checked against its own live predecessor only (app: the running
# app's io.voyager.build; Caddy: the live release's BUILD), so promoting one
# image while the other keeps an older run number is not a downgrade.
#
# Skips: each image carries io.voyager.<app|caddy>-inputs, a hash of every
# input its build can read (deploy/ci/image-inputs-id.sh: the Dockerfile,
# .dockerignore, the files its COPYs take, every base image pinned by digest).
# When the `prod` image already has this run's id, nothing is built and `prod`
# stays: a frontend-only merge doesn't restart the app (open chats survive),
# a backend-only merge doesn't touch the SPA. A missing/unreadable label or id
# means build (fail safe). The revision label still changes with every build;
# it is the skip that keeps the digest.
# Not in the id: what a RUN step resolves at build time, i.e. pip's version
# ranges in backend/requirements.txt (npm ci follows package-lock.json).
# Refresh: the weekly scheduled run (and workflow_dispatch with force)
# rebuilds both images WITHOUT CACHE, so base and dependency fixes flow, and a
# new digest also ends a hold on the VM. Each image records its last refresh
# in io.voyager.fresh-at (carried forward by cached builds); any run, a push
# included, refreshes an image whose prod copy is missing it or is over 7 days
# old (deploy/ci/build-decision.sh). So a scheduled run that a queued push
# replaced in the concurrency group, or a schedule GitHub disabled (cron stops
# after 60 days without repository activity; re-enable with
# `gh workflow enable deploy.yml`), still gets its refresh on the next push.
#
# schedule / workflow_dispatch: they run on main, so the OIDC token's
# job_workflow_ref, and with it the certificate identity, is still
# .../deploy.yml@refs/heads/main (the identity comes from the workflow file
# and ref, not the event). A dispatch from another branch is skipped
# (if: github.ref == 'refs/heads/main') and would fail verification anyway.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC: refresh (no-cache rebuild) of both images
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild both images even if their inputs are unchanged
        type: boolean
        default: true

# One publish at a time; never cancel a half-moved tag. Whole runs queue, so
# a run's build jobs read `prod` only after the previous run's promotes.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions: {}

env:
  APP_IMAGE: ghcr.io/rupakc/travel-planner-app
  CADDY_IMAGE: ghcr.io/rupakc/travel-planner-caddy
  FORCE: ${{ github.event_name == 'schedule' || inputs.force == true }}

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      # The build jobs below build and scan the images that actually ship
      skip-image-builds: true
    permissions:
      contents: read

  build-app:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push sha-* tags (no id-token: nothing is signed here)
    outputs:
      build: ${{ steps.state.outputs.build }}
      digest: ${{ steps.image.outputs.digest }}
      prod: ${{ steps.state.outputs.prod }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base pinned to its current digest (the same string goes into the
      # build arg and the inputs id); then: does prod already have it?
      - name: Inputs id and what prod already has
        id: state
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^ARG PYTHON_BASE=//p' backend/Dockerfile)"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $tag"; exit 1; }
          base="$tag@$digest"
          # An id that can't be computed is empty: never equal → build
          inputs="$(bash deploy/ci/image-inputs-id.sh backend/Dockerfile "PYTHON_BASE=$base")" || inputs=""
          printf 'base=%s\ninputs=%s\n' "$base" "$inputs" >>"$GITHUB_OUTPUT"
          bash deploy/ci/build-decision.sh app "$APP_IMAGE" "$inputs" "$FORCE"

      - name: Build and push app (sha tag only)
        id: image
        if: steps.state.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            PYTHON_BASE=${{ steps.state.outputs.base }}
          # io.voyager.build: the VM refuses images from an older run (no downgrades)
          # io.voyager.app-inputs: equal on the next run → no rebuild, no restart
          # io.voyager.fresh-at: last build without cache (see the header)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.voyager.build=${{ github.run_number }}
            io.voyager.app-inputs=${{ steps.state.outputs.inputs }}
            io.voyager.fresh-at=${{ steps.state.outputs.fresh_at }}
          # A refresh (weekly / forced / stale) rebuilds every layer
          no-cache: ${{ steps.state.outputs.fresh == 'true' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # By digest, before it can be signed; a failure skips promote-app only
      - name: Trivy scan (unfixed-ignored CRITICAL fails)
        if: steps.state.outputs.build == 'true'
        run: bash deploy/ci/trivy-scan.sh "$APP_IMAGE@${{ steps.image.outputs.digest }}"

  build-caddy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push sha-* tags (no id-token: nothing is signed here)
    outputs:
      build: ${{ steps.state.outputs.build }}
      digest: ${{ steps.image.outputs.digest }}
      prod: ${{ steps.state.outputs.prod }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both bases pinned to their current digests (build args + inputs id).
      # The Caddy runtime id (caddy-runtime-id.sh, from CADDY_BASE): the VM
      # recreates Caddy only when it changes (SPA and Caddyfile changes are
      # swapped in without a restart).
      - name: Inputs id, Caddy runtime id and what prod already has
        id: state
        run: |
          set -euo pipefail
          pin() {
            local tag digest
            tag="$(sed -n "s/^ARG $1=//p" deploy/gcp/caddy.Dockerfile)"
            digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $tag"; exit 1; }
            echo "$tag@$digest"
          }
          caddy_base="$(pin CADDY_BASE)"
          node_base="$(pin NODE_BASE)"
          runtime="$(bash deploy/gcp/caddy-runtime-id.sh "$caddy_base")"
          inputs="$(bash deploy/ci/image-inputs-id.sh deploy/gcp/caddy.Dockerfile \
            "CADDY_BASE=$caddy_base" "NODE_BASE=$node_base")" || inputs=""
          printf 'caddy_base=%s\nnode_base=%s\nruntime=%s\ninputs=%s\n' \
            "$caddy_base" "$node_base" "$runtime" "$inputs" >>"$GITHUB_OUTPUT"
          bash deploy/ci/build-decision.sh caddy "$CADDY_IMAGE" "$inputs" "$FORCE"

      - name: Build and push caddy + SPA (sha tag only)
        id: image
        if: steps.state.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/gcp/caddy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.CADDY_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            CADDY_BASE=${{ steps.state.outputs.caddy_base }}
            NODE_BASE=${{ steps.state.outputs.node_base }}
          # io.voyager.build: the VM refuses images from an older run (no downgrades)
          # io.voyager.caddy-runtime: a change recreates Caddy on the VM
          # io.voyager.caddy-inputs: equal on the next run → no rebuild
          # io.voyager.fresh-at: last build without cache (see the header)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.voyager.build=${{ github.run_number }}
            io.voyager.caddy-runtime=${{ steps.state.outputs.runtime }}
            io.voyager.caddy-inputs=${{ steps.state.outputs.inputs }}
            io.voyager.fresh-at=${{ steps.state.outputs.fresh_at }}
          # A refresh (weekly / forced / stale) rebuilds every layer
          no-cache: ${{ steps.state.outputs.fresh == 'true' }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      # By digest, before it can be signed; a failure skips promote-caddy only
      - name: Trivy scan (unfixed-ignored CRITICAL fails)
        if: steps.state.outputs.build == 'true'
        run: bash deploy/ci/trivy-scan.sh "$CADDY_IMAGE@${{ steps.image.outputs.digest }}"

  promote-app:
    # Plain needs: skipped unless ci AND build-app succeeded
    needs: [ci, build-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout (deploy/ci/promote-image.sh)
      packages: write # signatures live in GHCR; move the prod tag
      id-token: write # cosign keyless: GitHub OIDC → Sigstore certificate
    env:
      BUILT: ${{ needs.build-app.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: env.BUILT == 'true'
        with:
          cosign-release: v2.4.1
      - name: HEAD check → sign → verify as the VM will → move prod
        env:
          NAME: app
          IMAGE: ${{ env.APP_IMAGE }}
          NEW_DIGEST: ${{ needs.build-app.outputs.digest }}
          PROD_DIGEST: ${{ needs.build-app.outputs.prod }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # The identity the VM's deployer requires (deploy.sh CERT_IDENTITY)
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
          CERT_ISSUER: https://token.actions.githubusercontent.com
        run: bash deploy/ci/promote-image.sh

  promote-caddy:
    # Plain needs: skipped unless ci AND build-caddy succeeded
    needs: [ci, build-caddy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout (deploy/ci/promote-image.sh)
      packages: write # signatures live in GHCR; move the prod tag
      id-token: write # cosign keyless: GitHub OIDC → Sigstore certificate
    env:
      BUILT: ${{ needs.build-caddy.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: env.BUILT == 'true'
        with:
          cosign-release: v2.4.1
      - name: HEAD check → sign → verify as the VM will → move prod
        env:
          NAME: caddy
          IMAGE: ${{ env.CADDY_IMAGE }}
          NEW_DIGEST: ${{ needs.build-caddy.outputs.digest }}
          PROD_DIGEST: ${{ needs.build-caddy.outputs.prod }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # The identity the VM's deployer requires (deploy.sh CERT_IDENTITY)
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
          CERT_ISSUER: https://token.actions.githubusercontent.com
        run: bash deploy/ci/promote-image.sh
